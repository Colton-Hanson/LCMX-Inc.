<!doctype html>
<!-- index.html — the single HTML page. React draws everything inside <div id="root"> (see src/main.jsx). -->
<html lang="en"> <!-- lang="en" helps screen readers pick the right pronunciation -->
  <head>
    <meta charset="UTF-8" /> <!-- lets the page show characters like ’ and ✓ correctly -->
    <!-- Makes the page scale properly on phones instead of showing a tiny zoomed-out desktop view. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group Budget Tracker</title> <!-- text in the browser tab -->
  </head>
  <body>
    <div id="root"></div> <!-- empty on purpose: React fills this in -->
    <script type="module" src="/src/main.jsx"></script> <!-- starts the app -->
  </body>
</html>
